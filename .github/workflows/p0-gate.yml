name: P0 Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-static-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @tms/shared build

      - name: Build API
        run: pnpm --filter @tms/api build

      - name: Build web
        run: pnpm --filter @tms/web build

      - name: Mobile typecheck
        run: pnpm --filter @tms/mobile typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm --filter @tms/api test

      - name: Security audit (advisory)
        run: pnpm audit --prod --audit-level high || true

      - name: Drizzle migration drift check (advisory)
        run: pnpm --filter @tms/api exec drizzle-kit check || true

      - name: Validate compose config
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
