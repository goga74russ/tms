# ============================================================
# TMS - Production Docker Compose
# PostgreSQL + Redis + MinIO + API + Web + Nginx
#
# Production hardening:
#   - Resource limits on every service (mem_limit / cpus).
#   - JSON log rotation (max 10MB × 3 files per container).
#   - Required env vars validated via ${VAR:?Set VAR}.
#   - All services depend on dependencies being healthy first.
# ============================================================

# Shared logging config — rotate JSON logs at 10MB × 3 files to
# prevent unbounded disk growth on long-running production hosts.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tms} -d ${POSTGRES_DB:-tms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m
        reservations:
          memory: 128m

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-1 minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tms}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Credential encryption key — required for AES-GCM of provider creds.
      # Without this, in production every encryptCredentials() throws.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?Set CREDENTIALS_KEY}
      # SMTP for transactional email (signup verification, invites, billing).
      # Optional — without these, the email registry falls back to the
      # console mock and verification codes go to stdout only.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # ЮKassa webhook signing secret. Defensive: keep empty if not yet
      # wired so the webhook route rejects requests that can't be verified.
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET:-}
      # Платформенный ЮKassa оператора TMS (приём подписок на один счёт).
      # Значения — в /opt/transpult/.env (не в гите). Без них биллинг = mock.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Госключ callback HMAC secret. В production обязателен — без него
      # эндпоинт /api/signatures/gosklyuch/callback станет открытым каналом
      # инъекции поддельных подписей (см. server.ts boot-check).
      GOSKLYUCH_CALLBACK_SECRET: ${GOSKLYUCH_CALLBACK_SECRET:-}
      # Demo seed gating (A-P2). По дефолту в production /api/demo/*
      # возвращает 404, чтобы compromised admin-токен не мог стереть
      # тенант через cleanupDemoData(). Для пилот-сервера, где демо
      # нужно, явно опт-инить ALLOW_DEMO_SEED=true в .env.
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-}
      # DaData API key for INN/ОГРН lookup in /onboarding step 1 and
      # /api/dadata/* routes. Empty -> dadata module returns deterministic
      # mock data (good for dev / when DaData is unavailable).
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      # Carrier (ИП) reference data used to render waybills, invoices,
      # ЭТрН XML and other documents. Empty fallbacks keep the API booting
      # even in early-pilot deploys where some fields are TBD.
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_INN: ${COMPANY_INN:-}
      COMPANY_KPP: ${COMPANY_KPP:-}
      CARRIER_NAME: ${CARRIER_NAME:-}
      CARRIER_INN: ${CARRIER_INN:-}
      CARRIER_KPP: ${CARRIER_KPP:-}
      CARRIER_OGRNIP: ${CARRIER_OGRNIP:-}
      CARRIER_ADDRESS: ${CARRIER_ADDRESS:-}
      CARRIER_PHONE: ${CARRIER_PHONE:-}
      CARRIER_BANK: ${CARRIER_BANK:-}
      CARRIER_BIK: ${CARRIER_BIK:-}
      CARRIER_ACCOUNT: ${CARRIER_ACCOUNT:-}
      CARRIER_CORR: ${CARRIER_CORR:-}
      # TMS-internal tariff/rate constants used by trip cost calculator.
      FUEL_PRICE_PER_LITER: ${FUEL_PRICE_PER_LITER:-60}
      DRIVER_SALARY_PER_HOUR: ${DRIVER_SALARY_PER_HOUR:-350}
      AMORTIZATION_PER_KM: ${AMORTIZATION_PER_KM:-5}
      FUEL_NORM_PER_100KM: ${FUEL_NORM_PER_100KM:-30}
      BASE_OPERATIONAL_COST: ${BASE_OPERATIONAL_COST:-500}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000/api}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000/api}
      # Round 1D: Next.js middleware verifies JWT in edge runtime via jose.
      # Must share the same secret as the API to validate tokens.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m

  certbot:
    image: certbot/certbot
    profiles: ["ops"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  pgdata:
  redisdata:
  miniodata:
  certbot-etc:
  certbot-var:
  certbot-webroot:


